version: '3.8'

services:
  stars-store:
    build: .
    container_name: telegram_stars_store
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./store.db:/app/store.db
    environment:
      - DATABASE_PATH=/app/store.db
      - HOST=0.0.0.0
      - PORT=8000
